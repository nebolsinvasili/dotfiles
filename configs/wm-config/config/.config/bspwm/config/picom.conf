## ----- Shadows ----- ##

shadow = true;
shadow-radius = 15;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.2;
shadow-color = "#000000"


## ----- Fading ----- ##

fading = true;

fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5
no-fading-openclose = false
no-fading-destroyed-argb = false


## ----- Transparency ----- ##

inactive-opacity = 0.85;
active-opacity = 0.90;
frame-opacity = 0.90;
inactive-opacity-override = false;


## ----- Corners ----- ##

corner-radius = 6
round-borders = 8;


#################################
#       General Settings        #
#################################

# Available backends "xrender" "glx" "egl"
backend = "glx"

dithered-present = false;
vsync = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

use-damage = true;
# xrender-sync-fence = false
# transparent-clipping = false



#################################
#             Rules             #
#################################

blur: {
	method = "dual_kawase";
	strength = 9;
}

wintypes: {
	dropdown_menu = { opacity = 0.9; }
	tooltip = { fade = true; opacity = 0.9; focus = true; }
	popup_menu = { opacity = 0.9; }
}

rules: (

@include "picom-animations.conf"

)
